on:
  push:
    paths:
      - '**.R'
      - '**.Rmd'
      - '.github/workflows/lint_R.yml'

jobs:
  lint:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v3'     
      - uses: 'astral-sh/setup-uv@v6'
        with:
          activate-environment: true
      - run: |
          uv pip install '.[dev]'
      - uses: 'r-lib/actions/setup-r@v2'
      - uses: 'r-lib/actions/setup-r-dependencies@v2'
        with:
          working-directory: './R'
          cache: 'always'
      - run: |
          devtools::document()
          devtools::install(dependencies = FALSE)
        working-directory: './R'
        shell: Rscript {0}
      - run: |
          pak::pak("lintr")
          errors <- lintr::lint_package()
          print(errors)
          quit(save = "no", status = length(errors) != 0)
        working-directory: './R'
        shell: Rscript {0}
      - run: |
          devtools::check(error_on = "error", args = c("--no-examples", "--no-tests", "--no-vignettes"))
        working-directory: './R'
        shell: Rscript {0}