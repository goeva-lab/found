on:
  push:
    paths:
      - '**.py'
      - '.github/workflows/lint_py.yml'
jobs:
  lint:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v3'
      - uses: 'astral-sh/setup-uv@v6'
        with:
          activate-environment: true
      - run: |
          uv pip install '.[dev]' 'pyright'
      - uses: 'astral-sh/ruff-action@v3'
      - run: |
          pyright --warnings
