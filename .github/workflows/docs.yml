on:
  push:
    branches:
      - 'main'

jobs:
  build_docs:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
    steps:
      - uses: 'actions/checkout@v3'
      - uses: 'astral-sh/setup-uv@v6'
        with:
          activate-environment: true
      - run: |
          uv pip install '.[dev]'
      - uses: 'r-lib/actions/setup-tinytex@v2'
      - uses: 'r-lib/actions/setup-pandoc@v2'
      - uses: 'r-lib/actions/setup-r@v2'
      - uses: 'r-lib/actions/setup-r-dependencies@v2'
        with:
          working-directory: './R'
          cache: 'always'
      - run: |
          mkdir dist && touch dist/.nojekyll
      # `nb_execution_mode` set to off because runner does not have enough computational resources to render notebook
      # @TODO: look into using self-hosted runners depending on future hardware access
      - run: |
          python -m ipykernel install --user --name found && sphinx-build -D nb_execution_mode=off -b dirhtml -n docs docs/_build/html && mv docs/_build/html dist/py
      # `examples` set to FALSE because runner does not have enough computational resources to render examples
      # @TODO: look into using self-hosted runners depending on future hardware access
      - run: |
          devtools::document()
          devtools::install(dependencies = FALSE)
          devtools::build_manual(path = ".")
          pkgdown::build_site(
            examples = FALSE,
            override = list(
              destination = "../dist/R",
              repo = list(url = list(source = sprintf("https://github.com/goeva-lab/found/tree/%s/R", system("git rev-parse main", intern = TRUE))))
            )
          )
        working-directory: './R'
        shell: 'Rscript {0}'
      - run: |
          set -euxo pipefail
          
          git init -b gh-pages
          git add .
          git config user.name 'github-actions[bot]' && git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'publish: ${{ github.sha }}'
          git push -f 'https://git:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git' gh-pages
        working-directory: './dist'
      - run: |
          echo "FOUND_R_PACKAGE_VERSION=$(Rscript -e 'cat(unname(read.dcf("R/DESCRIPTION")[, "Version"]))')" >> '${{ github.env }}'
      - uses: 'actions/upload-artifact@v4'
        with:
          name: 'R manual'
          path: 'R/found_${{ env.FOUND_R_PACKAGE_VERSION }}.pdf'