[project]
name = "found"
version = "0.1.0"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "anndata>=0.12",
    "scikit-learn",
    "altair[all]",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "sphinx",
    "sphinx-autobuild",
    "sphinx-autodoc-typehints",
    "pydata-sphinx-theme",
    "myst-nb",
    "myst-parser",
    "jupytext",
    "ipykernel",
    "ipywidgets",
    "pyLemur",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
